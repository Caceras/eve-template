<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Offline · Ægentica</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #0a0a0a;
        --muted: #737373;
        --border: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --border: #2a2a2a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 320px;
        text-align: center;
      }
      img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      h1 {
        margin: 20px 0 6px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 20px;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--fg);
        color: var(--bg);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="title">You’re offline</h1>
      <p id="reason">
        Ægentica needs a connection to reach your agent. Your conversations are safe on your server.
        It continues on its own when you are back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Carry on as soon as the connection returns, as a native app would.
      addEventListener("online", () => location.reload());
      // Online, the server itself is not answering: usually for a moment while
      // a deploy restarts it (the service worker shows this page for the
      // proxy's 502, 503 and 504). Ask again every few seconds while in view.
      if (navigator.onLine) {
        document.title = "Reconnecting · Ægentica";
        document.getElementById("title").textContent = "Ægentica is not answering";
        document.getElementById("reason").textContent =
          "Your server is not reachable right now, usually for a moment while it updates. " +
          "Your conversations are safe on it. This page continues on its own when it is back.";
      }
      setInterval(async () => {
        if (!navigator.onLine || document.visibilityState !== "visible") return;
        try {
          const response = await fetch(location.href, { cache: "no-store" });
          if (![502, 503, 504].includes(response.status)) location.reload();
        } catch {
          // Still unreachable; ask again shortly.
        }
      }, 5000);
    </script>
  </body>
</html>
