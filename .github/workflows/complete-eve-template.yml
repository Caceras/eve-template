name: Complete Eve Template Materialization

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/complete-eve-template.yml"

permissions:
  contents: write

jobs:
  complete:
    if: github.repository == 'Caceras/eve-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore implementation overlay
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/eve-template-overlay.b64
          for part in 00 01 02 03 04 05; do
            git show 3edfc0ef3dac42af5ff0c137fdddb6b328c6c64f:.eve-template-bootstrap/overlay.part.$part >> /tmp/eve-template-overlay.b64
          done
          base64 --decode /tmp/eve-template-overlay.b64 > /tmp/eve-template-overlay.zip
          mkdir -p /tmp/eve-template-overlay-unpacked
          unzip -q /tmp/eve-template-overlay.zip -d /tmp/eve-template-overlay-unpacked
          test -f /tmp/eve-template-overlay-unpacked/eve-template-overlay/scripts/materialize-eve-template.mjs

      - name: Materialize complete template
        run: node /tmp/eve-template-overlay-unpacked/eve-template-overlay/scripts/materialize-eve-template.mjs "$GITHUB_WORKSPACE"

      - name: Commit all generated files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/complete-eve-template.yml
          git config user.name "eve-template-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: complete ultimate Eve template materialization"
          git push origin HEAD:main
