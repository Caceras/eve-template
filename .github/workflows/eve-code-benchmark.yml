name: eve-code

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-preflight:
    name: Model preflight (no benchmarks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Check configured Gateway model
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          MODEL: ${{ vars.EVE_CODE_BENCH_MODEL || 'google/gemini-3.8-flash' }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const key = process.env.AI_GATEWAY_API_KEY;
          if (!key) throw new Error('AI_GATEWAY_API_KEY is not configured for this workflow.');
          const model = process.env.MODEL;
          const response = await fetch('https://ai-gateway.vercel.sh/v1/chat/completions', {
            method: 'POST',
            redirect: 'error',
            signal: AbortSignal.timeout(60_000),
            headers: { authorization: `Bearer ${key}`, 'content-type': 'application/json' },
            body: JSON.stringify({ model, messages: [{ role: 'user', content: 'Reply with only OK.' }], max_tokens: 16 }),
          });
          const reader = response.body.getReader();
          const chunks = [];
          let bytes = 0;
          for (;;) {
            const next = await reader.read();
            if (next.done) break;
            bytes += next.value.byteLength;
            if (bytes > 16_384) { await reader.cancel(); throw new Error('Gateway preflight response exceeded 16 KiB.'); }
            chunks.push(next.value);
          }
          const text = Buffer.concat(chunks).toString('utf8').replaceAll(key, '[REDACTED]');
          let data;
          try { data = JSON.parse(text); } catch { data = { error: { message: text.slice(0, 1000) } }; }
          console.log(JSON.stringify({ model, status: response.status, error: data.error?.message ?? data.error ?? null,
            reply: data.choices?.[0]?.message?.content ?? null, usage: data.usage ?? null }, null, 2));
          if (!response.ok) process.exitCode = 1;
          JS
