name: eve-code

on:
  workflow_dispatch:
    inputs:
      harness:
        description: Harness to validate
        type: choice
        default: eve-code
        options: [eve-code, codex, opencode]
      task:
        description: Exact task; empty runs full SWE-lean
        type: string
        default: log-summary-date-ranges

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark harness
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: gemini-baseline-${{ inputs.harness }}
      cancel-in-progress: false
    steps:
      - name: Checkout benchmark runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vercel-labs/eve-bench
          ref: f40920a4d989efc9c1f5cc28975a21362ee5f63f
          ssh-key: ${{ secrets.EVE_BENCH_SSH_KEY }}
          path: .eve-bench-action
          persist-credentials: false
      - name: Validate selected harness
        uses: ./.eve-bench-action
        with:
          harness: ${{ inputs.harness }}
          agent-repository: vercel/eve
          agent-path: packages/eve-code
          agent-ref: c3cdf2c4e07c7b7ad2031300236cda967b79b295
          dataset: swe-lean
          task: ${{ inputs.task }}
          model: google/gemini-3.8-flash
          attempts: "1"
          concurrency: "4"
          artifact-name: ${{ inputs.task && 'gemini-probe' || 'gemini-baseline' }}-${{ inputs.harness }}
          gateway-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          github-token: ${{ github.token }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-team-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
