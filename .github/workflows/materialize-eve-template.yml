name: Materialize Eve Template

on:
  push:
    branches: [main]
    paths:
      - ".eve-template-bootstrap/materialize.trigger"

permissions:
  contents: write

concurrency:
  group: materialize-eve-template
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild overlay archive
        shell: bash
        run: |
          set -euo pipefail
          cat .eve-template-bootstrap/overlay.part.* | base64 --decode > /tmp/eve-template-overlay.zip
          mkdir -p /tmp/eve-template-overlay
          unzip -q /tmp/eve-template-overlay.zip -d /tmp/eve-template-overlay
          test -f /tmp/eve-template-overlay/scripts/materialize-eve-template.mjs

      - name: Materialize against this Eve checkout
        run: node /tmp/eve-template-overlay/scripts/materialize-eve-template.mjs "$GITHUB_WORKSPACE"

      - name: Verify generated surface
        working-directory: apps/templates/eve-template
        run: node scripts/check-eve-surface.mjs

      - name: Remove bootstrap files
        shell: bash
        run: |
          rm -rf .eve-template-bootstrap
          rm -f .github/workflows/materialize-eve-template.yml

      - name: Commit generated template
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "feat: materialize ultimate Eve reference template"
          git push origin HEAD:main
