name: Apply exact Aegentica release fix
on:
  push:
    branches: [codex/aegentica-orchestration-release]
    paths: [.github/workflows/apply-aegentica-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Caceras/eve-template' && github.ref == 'refs/heads/codex/aegentica-orchestration-release'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'apps/templates/eve-template/app/_components/agent-chat.tsx';
            const source = fs.readFileSync(path, 'utf8');
            const before = 'import { defaultMessageReducer, useEveAgent } from "eve/react";';
            const after = 'import { defaultMessageReducer } from "eve/react";\nimport { useEveAgent } from "@/lib/chat/use-reliable-eve-agent";';
            if (source.split(before).length !== 2) throw new Error('Expected exactly one original eve import; refusing an ambiguous edit.');
            const updated = source.replace(before, after);
            const result = await github.graphql(`mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input:$input) { commit { oid url } } }`, {input:{branch:{repositoryNameWithOwner:'Caceras/eve-template',branchName:'codex/aegentica-orchestration-release'},expectedHeadOid:context.sha,message:{headline:'fix: preserve attachments and unlock the composer after failed sends',body:'Route the product commands through the existing eve snapshot error contract. Keep the upstream runtime intact.\n\nSigned-off-by: Riki Caceras <rikicaceras@gmail.com>'},fileChanges:{additions:[{path,contents:Buffer.from(updated).toString('base64')}]}}});
            core.info(JSON.stringify(result.createCommitOnBranch.commit));
