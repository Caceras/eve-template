name: Eve Template

on:
  push:
    branches: [main]
    paths:
      - "packages/eve/**"
      - "docs/**"
      - "apps/docs/registry/**"
      - "apps/docs/registry.json"
      - "apps/templates/eve-chat-template/**"
      - "apps/templates/eve-template/**"
      - ".github/workflows/eve-template.yml"
  pull_request:
    paths:
      - "packages/eve/**"
      - "docs/**"
      - "apps/docs/registry/**"
      - "apps/docs/registry.json"
      - "apps/templates/eve-chat-template/**"
      - "apps/templates/eve-template/**"
      - ".github/workflows/eve-template.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/templates/eve-template
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm eve:surface:check
      - run: pnpm typecheck
      - run: pnpm build:eve
      - run: pnpm build
