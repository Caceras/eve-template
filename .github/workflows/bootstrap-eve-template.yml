name: Materialize ultimate Eve template

on:
  workflow_dispatch:
  push:
    paths:
      - ".eve-template-bootstrap/**"
      - ".github/workflows/bootstrap-eve-template.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'Caceras/eve-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reassemble implementation overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .eve-template-bootstrap/overlay.part.* | base64 --decode > /tmp/eve-template-overlay.zip
          mkdir -p /tmp/eve-template-overlay-unpacked
          unzip -q /tmp/eve-template-overlay.zip -d /tmp/eve-template-overlay-unpacked
          test -f /tmp/eve-template-overlay-unpacked/eve-template-overlay/scripts/materialize-eve-template.mjs

      - name: Materialize from official Eve sources
        run: node /tmp/eve-template-overlay-unpacked/eve-template-overlay/scripts/materialize-eve-template.mjs "$GITHUB_WORKSPACE"

      - name: Remove one-shot bootstrap
        shell: bash
        run: |
          rm -rf .eve-template-bootstrap
          rm -f .github/workflows/bootstrap-eve-template.yml

      - name: Commit ultimate template
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eve-template-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: materialize ultimate Eve reference template"
          git push origin HEAD:main
