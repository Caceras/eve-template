name: Aegentica product

on:
  push:
    branches: [main, codex/aegentica-orchestration-release]
    paths:
      - apps/templates/eve-template/**
      - apps/templates/eve-chat-template/**
      - .github/workflows/aegentica-product.yml
  pull_request:
    paths:
      - apps/templates/eve-template/**
      - apps/templates/eve-chat-template/**
      - .github/workflows/aegentica-product.yml

permissions:
  contents: read

concurrency:
  group: aegentica-product-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare package manager and evidence directory
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
          mkdir -p /tmp/aegentica-qa
          git rev-parse HEAD > /tmp/aegentica-qa/revision.txt
          git archive --format=tar.gz --output=/tmp/aegentica-qa/source.tar.gz HEAD
      - name: Install native compression build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends liblzma-dev pkg-config
      - name: Install locked product dependencies
        working-directory: apps/templates/eve-template
        run: pnpm install --frozen-lockfile
      - name: Check production product
        working-directory: apps/templates/eve-template
        run: bash scripts/check-product.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegentica-release-check-${{ github.run_id }}
          path: /tmp/aegentica-qa
          retention-days: 3
          if-no-files-found: warn
