name: Aegentica product
on:
  push:
    branches: [codex/aegentica-orchestration-release]
permissions:
  contents: read
concurrency:
  group: aegentica-product-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-check:
    if: github.repository == 'Caceras/eve-template' && github.event_name == 'push' && github.ref == 'refs/heads/codex/aegentica-orchestration-release'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare package manager
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
          mkdir -p /tmp/aegentica-qa
      - name: Verify and expand reviewed source edits
        id: apply
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          root = Path.cwd()
          parts = [root / f'.github/aegentica-changes.{i}.b64' for i in range(1, 6)]
          if not parts[0].exists():
              print('Source edits already applied.')
              raise SystemExit(0)
          data = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True), memlimit=128*1024*1024)
          assert len(data) < 500000
          assert hashlib.sha256(data).hexdigest() == '57eca627696eb4fc99281f83b7065acacc33f18f163f38e09d239c8a201c56c9'
          entries = json.loads(data)
          assert isinstance(entries, list) and 0 < len(entries) <= 100
          outputs = {}
          for entry in entries:
              name = entry['path']
              assert name == 'README.md' or name.startswith('apps/templates/eve-template/')
              path = root / name
              assert '..' not in Path(name).parts and not Path(name).is_absolute()
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              assert name not in outputs
              if entry['sha256'] is None:
                  assert not path.exists(), name
                  output = entry['content']
              else:
                  original = path.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == entry['sha256'], name
                  lines = original.decode().splitlines(keepends=True)
                  previous = len(lines) + 1
                  for start, end, replacement in reversed(entry['edits']):
                      assert 0 <= start <= end < previous
                      lines[start:end] = [replacement]
                      previous = start + 1
                  output = ''.join(lines)
              assert len(output.encode()) < 250000
              outputs[name] = output
          for name, output in outputs.items():
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(output)
          Path('/tmp/aegentica-paths.json').write_text(json.dumps(list(outputs)))
          print(f'Applied {len(outputs)} hash-verified source files.')
          PY
      - name: Format changed source
        run: |
          if test -f /tmp/aegentica-paths.json; then
            python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('/tmp/aegentica-paths.json'))
          subprocess.run(['pnpm', 'dlx', 'oxfmt@0.66.0', '--write', *paths], check=True)
          PY
          fi
      - name: Publish expanded source to this feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          if (!existsSync('/tmp/aegentica-paths.json')) process.exit(0);
          const prefix = 'https://api.github.com/repos/Caceras/eve-template';
          const branch = 'heads/codex/aegentica-orchestration-release';
          async function api(path, method = 'GET', body) {
            const response = await fetch(prefix + path, {method, headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, body: body ? JSON.stringify(body) : undefined});
            if (!response.ok) throw new Error(`${method} ${path}: ${response.status}`);
            return response.json();
          }
          const head = process.env.GITHUB_SHA;
          const ref = await api('/git/ref/' + branch);
          if (ref.object.sha !== head) throw new Error('Branch advanced; reconcile before publishing.');
          const commit = await api('/git/commits/' + head);
          const paths = JSON.parse(readFileSync('/tmp/aegentica-paths.json', 'utf8'));
          const tree = paths.map(path => ({path, mode:'100644', type:'blob', content:readFileSync(path,'utf8')}));
          for (let i=1;i<=5;i++) tree.push({path:`.github/aegentica-changes.${i}.b64`, mode:'100644', type:'blob', sha:null});
          const nextTree = await api('/git/trees','POST',{base_tree:commit.tree.sha, tree});
          const next = await api('/git/commits','POST',{message:'feat: ship saved agents, delegation and multimodal workspace\n\nPreserve the eve runtime and self-hosted storage while adding authenticated profile orchestration, primary-chat attachments, image management, capability discovery and accessible navigation.\n\nSigned-off-by: Riki Caceras <rikicaceras@gmail.com>', tree:nextTree.sha, parents:[head]});
          await api('/git/refs/' + branch,'PATCH',{sha:next.sha,force:false});
          writeFileSync('/tmp/aegentica-source-sha',next.sha);
          console.log('Expanded source revision:', next.sha);
          JS
          if test -f /tmp/aegentica-source-sha; then
            git fetch origin "$(cat /tmp/aegentica-source-sha)"
            git reset --hard "$(cat /tmp/aegentica-source-sha)"
          fi
      - name: Archive exact public source
        run: git archive --format=tar.gz --output=/tmp/aegentica-qa/source.tar.gz HEAD
      - name: Install locked product dependencies
        id: install
        working-directory: apps/templates/eve-template
        run: pnpm install --frozen-lockfile
      - name: Deterministic product regression checks
        id: unit
        continue-on-error: true
        working-directory: apps/templates/eve-template
        run: |
          failed=0
          for name in agent-profiles chat-store github-settings image-generation media-library memory-store models openrouter-model production provider-settings push-and-task-runner telegram-and-schedules; do
            echo "Checking $name"
            if node "scripts/test-$name.mjs" > "/tmp/aegentica-qa/test-$name.log" 2>&1; then
              echo "PASS $name"
            else
              echo "FAIL $name"
              tail -80 "/tmp/aegentica-qa/test-$name.log"
              failed=1
            fi
          done
          exit "$failed"
      - name: Compile eve
        id: eve
        continue-on-error: true
        working-directory: apps/templates/eve-template
        run: pnpm build:eve 2>&1 | tee /tmp/aegentica-qa/build-eve.log
      - name: Typecheck product
        id: types
        continue-on-error: true
        working-directory: apps/templates/eve-template
        run: pnpm typecheck 2>&1 | tee /tmp/aegentica-qa/typecheck.log
      - name: Build Next.js production
        id: build
        continue-on-error: true
        working-directory: apps/templates/eve-template
        run: pnpm build 2>&1 | tee /tmp/aegentica-qa/build-next.log
      - name: Install isolated browser test tooling
        if: steps.build.outcome == 'success' && steps.eve.outcome == 'success'
        run: |
          npm install --prefix /tmp/aegentica-browser --save-exact playwright@1.63.0
          node /tmp/aegentica-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser acceptance on disposable local data
        id: browser
        if: steps.build.outcome == 'success' && steps.eve.outcome == 'success'
        continue-on-error: true
        working-directory: apps/templates/eve-template
        run: |
          export EVE_SESSION_SECRET="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))")"
          export EVE_CHAT_PASSWORD="$(node -e "console.log(require('node:crypto').randomBytes(24).toString('hex'))")"
          export EVE_CHAT_USERNAME=Riki
          export BETTER_AUTH_URL=http://localhost:3000
          export EVE_MEMORY_DIR=/tmp/aegentica-state/memory
          export EVE_CHAT_DB_PATH=/tmp/aegentica-state/chats.sqlite
          export PLAYWRIGHT_MODULE=/tmp/aegentica-browser/node_modules/playwright/index.mjs
          export QA_ARTIFACTS=/tmp/aegentica-qa
          mkdir -p /tmp/aegentica-state/memory
          node scripts/start-self-hosted.mjs > /tmp/aegentica-qa/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /tmp/aegentica-qa/health.json; then break; fi
            sleep 2
          done
          node scripts/test-product-browser.mjs 2>&1 | tee /tmp/aegentica-qa/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegentica-release-check-${{ github.run_id }}
          path: /tmp/aegentica-qa
          retention-days: 3
          if-no-files-found: warn
      - name: Enforce all release checks
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          EVE: ${{ steps.eve.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          node -e "for(const key of ['INSTALL','UNIT','EVE','TYPES','BUILD','BROWSER']) { console.log(key,process.env[key]); if(process.env[key]!=='success') process.exitCode=1; }"
