name: Aegentica product
on:
  push:
    branches: [codex/aegentica-orchestration-release]
permissions:
  contents: read
jobs:
  format-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: |
          mkdir formatter
          npm install --prefix formatter --save-exact oxfmt@0.66.0
          tar -czf aegentica-formatter.tar.gz formatter
      - uses: actions/upload-artifact@v4
        with:
          name: aegentica-formatter
          path: aegentica-formatter.tar.gz
          retention-days: 1
