name: Aegentica product

on:
  push:
    branches: [codex/aegentica-orchestration-release]
  pull_request:
    paths:
      - 'apps/templates/eve-template/**'
      - '.github/workflows/aegentica-product.yml'

permissions:
  contents: read

concurrency:
  group: aegentica-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Product source and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package public source for isolated review
        run: |
          git archive --format=tar.gz --output=aegentica-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: aegentica-source-${{ github.sha }}
          path: aegentica-source.tar.gz
          retention-days: 1
          if-no-files-found: error
