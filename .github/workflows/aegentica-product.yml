name: Aegentica product

on:
  push:
    branches: [codex/aegentica-orchestration-release]
  pull_request:
    paths:
      - 'apps/templates/eve-template/**'
      - '.github/workflows/aegentica-product.yml'

permissions:
  contents: read

concurrency:
  group: aegentica-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    name: Reproducible product environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked product dependencies
        working-directory: apps/templates/eve-template
        run: pnpm install --frozen-lockfile
      - name: Prepare offline validation tools
        run: |
          mkdir -p validation-tools/bin
          cp "$(command -v node)" validation-tools/bin/node
          cd validation-tools
          npm init -y > /dev/null
          npm install --save-exact @playwright/test@latest
          PLAYWRIGHT_BROWSERS_PATH=./browsers npx playwright install chromium
          cd ..
          tar -czf aegentica-validation.tar.gz apps/templates/eve-template/node_modules validation-tools
          split -b 240M -d aegentica-validation.tar.gz aegentica-part-
      - uses: actions/upload-artifact@v4
        with:
          name: validation-part-0
          path: aegentica-part-00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: validation-part-1
          path: aegentica-part-01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: validation-part-2
          path: aegentica-part-02
          retention-days: 1
          compression-level: 0
